services:
  - type: web
    name: pulsedesk
    env: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pulsedesk-db
          property: connectionString

databases:
  - name: pulsedesk-db
    databaseName: pulsedesk_production
    user: pulsedesk
    plan: free

name: PulseDesk CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Rails Tests & SLA TravelTo Verification
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Ensure binstubs are executable
        run: chmod +x bin/*

      - name: Prepare storage and database
        run: |
          mkdir -p storage
          bundle exec rails db:test:prepare

      - name: Run all tests (Durum Makinesi, 3x TravelTo, Otomasyon)
        run: bundle exec rails test

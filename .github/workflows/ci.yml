name: PulseDesk CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Rails Tests & SLA TravelTo Verification
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run all tests (Durum Makinesi, 3x TravelTo, Otomasyon)
        run: bin/rails test

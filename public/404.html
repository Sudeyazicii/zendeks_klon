<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>404 Sayfa Bulunamadı | PulseDesk</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
      color: #4338ca;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
      border: 1px solid #a5b4fc;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.75rem;
    }
    p {
      color: #64748b;
      font-size: 0.925rem;
      line-height: 1.55;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #4f46e5;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.925rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: background 0.15s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">🔍</div>
    <h1>404</h1>
    <h2>Sayfa Bulunamadı</h2>
    <p>Aradığınız destek talebi, makale veya sayfa taşınmış veya silinmiş olabilir.</p>
    <a href="/" class="btn">← PulseDesk Ana Sayfasına Dön</a>
  </div>
</body>
</html>
